<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Andrade Store</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}header{background:#080808;color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:24px}.logo b{color:#e11}.panel{max-width:1200px;margin:auto;padding:40px 5%}.hero{background:#080808;color:#fff;padding:70px 5%}.hero h1{font-size:clamp(45px,8vw,90px);margin:10px 0}.red{background:#e11;color:#fff}.btn{display:inline-block;padding:13px 18px;border-radius:8px;text-decoration:none;font-weight:800;border:0}.cat{margin-bottom:55px}.cathead{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.photo{aspect-ratio:4/5;background:#eee;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{font-weight:900;margin-top:8px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;max-width:850px;width:100%;max-height:92vh;overflow:auto;border-radius:14px;position:relative}.close{position:absolute;right:10px;top:10px;z-index:3;border:0;border-radius:50%;font-size:24px;width:38px;height:38px}.mg{display:grid;grid-template-columns:1fr 1fr}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#eee}.gallery img{min-width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:start}.details{padding:35px}@media(max-width:700px){.mg{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo">ANDRADE<b>.</b>STORE</div><a class="btn red" href="admin.html">PAINEL</a></header><section class="hero"><div class="panel"><h1>SEU ESTILO.<br>SUA PRESENÇA.</h1><p>Moda masculina & streetwear.</p></div></section><main class="panel" id="catalogo"></main>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeM()">×</button><div class="mg"><div class="gallery" id="gallery"></div><div class="details"><small>ANDRADE STORE</small><h2 id="mn"></h2><h3 id="mp"></h3><p id="md"></p><div id="ms"></div><a id="wa" class="btn red">Tirar dúvida pelo WhatsApp</a></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let ps=[];
async function load(){let c=(await db.from('categories').select('*').eq('active',true).order('sort_order')).data||[],p=(await db.from('products').select('*').eq('active',true).order('created_at',{ascending:false})).data||[];ps=p;document.getElementById('catalogo').innerHTML=c.map(x=>{let a=p.filter(y=>y.category_id===x.id);if(!a.length)return '';return '<section class="cat"><div class="cathead"><h2>'+esc(x.name)+'</h2></div><div class="grid">'+a.map((q,i)=>'<article class="card" onclick="openM(\''+q.id+'\')"><div class="photo"><img src="'+esc((q.images||[])[0]||'')+'"></div><div class="info"><b>'+esc(q.name)+'</b><div class="price">'+esc(q.price||'Consulte o valor')+'</div></div></article>').join('')+'</div></section>'}).join('')||'<p>Nenhum produto cadastrado.</p>'}
function openM(id){let p=ps.find(x=>x.id===id);gallery.innerHTML=(p.images||[]).map(x=>'<img src="'+esc(x)+'">').join('');mn.textContent=p.name;mp.textContent=p.price||'Consulte o valor';md.textContent=p.description||'';ms.innerHTML=(p.sizes||[]).map(x=>'<span style="display:inline-block;padding:8px;border:1px solid #ccc;margin:3px">'+esc(x)+'</span>').join('');wa.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('Olá! Tenho interesse em '+p.name);modal.classList.add('show')}
function closeM(){modal.classList.remove('show')}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();
</script></body></html>
